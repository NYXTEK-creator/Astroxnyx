<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astryx AI</title>
    <style>
        :root {
            --bg: #f7f8fc;
            --panel: rgba(255, 255, 255, 0.88);
            --ink: #202332;
            --muted: #70758a;
            --line: #e4e6f0;
            --accent: #7257e8;
            --accent-2: #b85ed6;
            --assistant: #ffffff;
            --user: linear-gradient(135deg, #7257e8, #9b68e8);
            --shadow: 0 14px 40px rgba(48, 39, 100, 0.10);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 18% 0%, rgba(189, 169, 255, .30), transparent 32rem),
                radial-gradient(circle at 90% 90%, rgba(255, 185, 221, .24), transparent 30rem),
                var(--bg);
            height: 100vh;
            overflow: hidden;
        }
        button, input { font: inherit; }
        .container { width: 100%; height: 100vh; display: flex; }
        .sidebar {
            width: 270px;
            flex: 0 0 270px;
            padding: 22px 16px;
            color: #303247;
            background: rgba(255, 255, 255, .72);
            border-right: 1px solid rgba(218, 220, 234, .9);
            backdrop-filter: blur(18px);
        }
        .sidebar h2 {
            padding: 8px 10px 12px;
            font-size: 15px;
            letter-spacing: .02em;
        }
        .new-chat {
            width: 100%;
            padding: 12px 14px;
            margin: 4px 0 16px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: 0;
            border-radius: 14px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(114, 87, 232, .22);
            transition: transform .18s, box-shadow .18s;
        }
        .new-chat:hover { transform: translateY(-1px); box-shadow: 0 11px 25px rgba(114, 87, 232, .30); }
        #chatMemory { overflow-y: auto; height: calc(100vh - 116px); }
        .history-item {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 3px 0;
            padding: 10px;
            color: #5b5f72;
            background: transparent;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            transition: background .18s, color .18s;
        }
        .history-item:hover, .history-item.active { color: #2c2e40; background: rgba(114, 87, 232, .10); }
        .history-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
        .history-delete { opacity: 0; color: #8c8fa0; padding: 2px 5px; }
        .history-item:hover .history-delete { opacity: 1; }
        .main-content { min-width: 0; flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .header {
            padding: 22px 24px 12px;
            text-align: center;
            background: transparent;
        }
        .header h1 {
            font-size: clamp(22px, 3vw, 30px);
            margin-bottom: 5px;
            letter-spacing: -.04em;
            background: linear-gradient(100deg, #403568, #8b55d9);
        }
        .header p { color: var(--muted); font-size: 12px; }
        #runtimeStatus { margin-top: 7px; font-weight: 600; color: #77738b; }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            width: min(900px, 100%);
            margin: 0 auto;
            padding: 22px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .message { display: flex; animation: floatIn .28s ease-out; }
        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(7px) scale(.99); }
            to { opacity: 1; transform: none; }
        }
        .message-content {
            max-width: min(75%, 700px);
            padding: 13px 17px;
            border-radius: 20px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.55;
        }
        .message.user .message-content {
            color: white;
            background: var(--user);
            border-bottom-right-radius: 7px;
            box-shadow: 0 8px 22px rgba(114, 87, 232, .18);
        }
        .message.assistant .message-content {
            color: var(--ink);
            background: var(--assistant);
            border: 1px solid var(--line);
            border-bottom-left-radius: 7px;
            box-shadow: 0 8px 28px rgba(48, 39, 100, .07);
        }
        .stream-metric { margin-top: 7px; color: var(--muted); font-size: 11px; }
        .settings-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin: 14px auto 0;
            width: min(900px, calc(100% - 24px));
        }
        .provider-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,.85);
            border-radius: 999px;
            box-shadow: 0 8px 20px rgba(48, 39, 100, .05);
            color: var(--ink);
            font-size: 12px;
            font-weight: 600;
        }
        .provider-toggle input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .generated-image {
            display: block;
            width: min(100%, 640px);
            max-height: 640px;
            object-fit: contain;
            border-radius: 12px;
        }
        .resend-button {
            margin: 5px 0 0 10px;
            padding: 5px 9px;
            color: #85899b;
            background: transparent;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
        }
        .resend-button:hover { color: var(--accent); background: rgba(114, 87, 232, .08); }
        .coding-activity { width: min(760px, 92%); margin: -8px 0 2px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.78); box-shadow: 0 8px 24px rgba(48,39,100,.06); overflow: hidden; }
        .coding-activity summary { padding: 11px 14px; color: #55596d; cursor: pointer; font-size: 13px; font-weight: 650; list-style: none; }
        .coding-activity summary::before { content: "⌘"; margin-right: 8px; color: var(--accent); }
        .coding-activity[open] summary { border-bottom: 1px solid var(--line); }
        .coding-details { padding: 12px 14px; color: var(--muted); font-size: 12px; line-height: 1.55; }
        .coding-details strong { color: var(--ink); }
        .code-preview { margin-top: 10px; padding: 11px 12px; max-height: 220px; overflow: auto; border-radius: 11px; background: #252333; color: #eeeaf9; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap; }
        .activity-applied { color: #21845b; }
        .activity-rejected { color: #b14d62; }
        .activity-transcript { margin-top: 10px; display: grid; gap: 7px; }
        .activity-event { padding: 9px 10px; border-left: 3px solid #c9bdf5; border-radius: 7px; background: #f7f5fd; }
        .activity-event-head { color: #514968; font-weight: 700; text-transform: capitalize; }
        .activity-event pre { margin-top: 6px; max-height: 150px; overflow: auto; white-space: pre-wrap; font: 11px/1.45 Consolas, monospace; color: #59536c; }
        .typing { display: flex; align-items: center; gap: 9px; padding: 13px 17px; color: var(--muted); font-size: 13px; }
        .thinking-pulse {
            width: 10px; height: 10px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #e478b8);
            animation: pulse 1.1s infinite ease-in-out;
        }
        @keyframes pulse { 50% { opacity: .45; transform: scale(.72); } }
        .input-box {
            display: flex;
            gap: 10px;
            width: min(850px, calc(100% - 40px));
            margin: 0 auto 20px;
            padding: 9px 10px 9px 18px;
            background: rgba(255,255,255,.94);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }
        .input-box input {
            flex: 1; min-width: 0; padding: 9px 2px;
            color: var(--ink); background: transparent; border: 0; outline: none;
        }
        .input-box input::placeholder { color: #a0a3b1; }
        .input-box button {
            padding: 10px 19px;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 650;
            transition: transform .18s, filter .18s;
        }
        .input-box button:hover { transform: translateY(-1px); filter: brightness(1.06); }
        .input-box button:active { transform: scale(.97); }
        .input-box button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .error { color: #a23249; background: #fff0f3; padding: 12px 16px; border-radius: 15px; }
        .info { text-align: center; padding: 24px; font-size: 13px; color: var(--muted); }
        @media (max-width: 700px) {
            .sidebar { display: none; }
            .header { padding-top: 16px; }
            .message-content { max-width: 90%; }
            .chat-box { padding: 14px 16px; }
            .input-box { width: calc(100% - 24px); margin-bottom: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
        <div class="header">
            <h1>Astryx</h1>
            <p>A thoughtful coding assistant that can improve alongside you.</p>
            <p id="runtimeStatus">Ready to chat.</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="info">
                <p>Start a conversation with the AI assistant</p>
            </div>
        </div>

        <div class="input-box">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your message..." 
                autocomplete="off"
            >
            <button id="sendBtn">Send</button>
        </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const runtimeStatus = document.getElementById('runtimeStatus');
        const API_KEY = 'sk-nyx-LJDqFBEijMreGLUnIYSM2LQgyNmh2zlVYQSg2mnrL9m';
        let conversationMessages = [];

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            messageDiv.appendChild(content);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return content;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || sendBtn.disabled) return;
            if (API_KEY === 'PASTE_YOUR_ASTRYX_API_KEY_HERE') {
                runtimeStatus.textContent = 'Set API_KEY in this script to your Astryx API key.';
                return;
            }

            userInput.value = '';
            sendBtn.disabled = true;
            addMessage(message, true);
            conversationMessages.push({ role: 'user', content: message });
            runtimeStatus.textContent = 'Connecting to the Astryx chat API...';

            try {
                const response = await fetch(
                    'https://api.astroxnyx.com/v1/chat/completions',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            messages: conversationMessages,
                            max_tokens: 200,
                            temperature: 0.7,
                            top_k: 50,
                            stream: true
                        })
                    }
                );

                if (!response.ok) {
                    const payload = await response.json().catch(() => ({}));
                    const detail = payload.error?.message || payload.error;
                    if (response.status === 404) {
                        throw new Error('The server does not provide the chat endpoint. Start the Astryx Python API server. (HTTP 404)');
                    }
                    throw new Error(detail || `HTTP ${response.status}`);
                }
                if (!response.body) throw new Error('The server did not return a streaming response.');

                const content = addMessage('');
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let generated = '';

                const consumeEvent = eventText => {
                    const line = eventText.split('\n').find(item => item.startsWith('data:'));
                    if (!line) return;
                    const data = line.slice(5).trim();
                    if (!data || data === '[DONE]') return;
                    const event = JSON.parse(data);
                    if (event.error) throw new Error(event.error.message || 'Generation failed.');
                    const fragment = event.choices?.[0]?.delta?.content;
                    if (fragment) {
                        generated += fragment;
                        content.textContent = generated;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                };

                while (true) {
                    const { value, done } = await reader.read();
                    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
                    const events = buffer.split('\n\n');
                    buffer = events.pop();
                    for (const event of events) consumeEvent(event);
                    if (done) break;
                }
                if (buffer.trim()) consumeEvent(buffer);
                conversationMessages.push({ role: 'assistant', content: generated });
                runtimeStatus.textContent = 'Connected to Astryx chat API.';
            } catch (error) {
                conversationMessages.pop();
                addMessage(`Chat request failed: ${error.message}`);
                runtimeStatus.textContent = `API request failed: ${error.message}`;
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') sendMessage();
        });
</script>
</body>
</html>
