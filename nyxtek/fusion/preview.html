<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0e1b">
    <title>Fusion Card Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Orbitron&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/main.css">
    <link rel="stylesheet" href="assets/styles/card.css">
    <link rel="stylesheet" href="assets/styles/responsive.css">
    <style>
        body.preview-page {
            min-height: 100vh;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .preview-header,
        .preview-grid {
            width: min(100%, 90rem);
            margin-inline: auto;
        }

        .preview-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .preview-header .title {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        .preview-status {
            flex: 0 0 auto;
            margin: 0;
            color: #c0c6d5;
            font-family: "Orbitron", sans-serif;
            font-size: 0.8rem;
            text-align: right;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 10rem), 1fr));
            justify-items: center;
            align-items: start;
            gap: clamp(0.75rem, 2vw, 1.4rem);
        }

        .preview-grid > :is(.fireCard, .waterCard, .natureCard, .electricCard, .lightCard, .darkCard,
            .flowerCard, .dewCard, .demonCard, .solarCard, .psychicCard, .bloodCard, .lavaCard,
            .preview-fallback) {
            width: min(100%, var(--fusion-card-width));
            height: auto;
            aspect-ratio: 2 / 3;
        }

        .preview-grid > .preview-fallback {
            box-sizing: border-box;
            display: grid;
            align-content: center;
            justify-items: center;
            gap: 0.75rem;
            padding: 1rem;
            border: 3px solid #a7a7a7;
            border-radius: clamp(0.7rem, 2vw, 1.25rem);
            background: linear-gradient(145deg, #858585, #555, #292929);
            box-shadow: 0 0 0 3.5px #000, 0 0 5px #aaa;
            color: #111;
            font-family: "Orbitron", sans-serif;
            text-align: center;
        }

        .preview-fallback-name {
            max-width: 100%;
            margin: 0;
            overflow-wrap: anywhere;
            font-size: clamp(0.8rem, 2vw, 1rem);
            font-weight: 800;
            text-transform: uppercase;
        }

        .preview-fallback-symbol {
            margin: 0;
            color: #000;
            font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            line-height: 1;
        }

        .preview-fallback-note {
            margin: 0;
            color: #171717;
            font-size: 0.65rem;
            font-weight: 700;
        }

        @media (max-width: 520px) {
            .preview-header {
                align-items: start;
                flex-direction: column;
            }

            .preview-status {
                text-align: left;
            }
        }
    </style>
</head>
<body class="preview-page">
    <header class="preview-header">
        <h1 class="title">Fusion Card Preview</h1>
        <p id="preview-status" class="preview-status" role="status" aria-live="polite">Loading cards</p>
    </header>
    <main id="preview-grid" class="preview-grid" aria-label="All Fusion character cards"></main>

    <script type="module">
        import renderCharacter from './assets/scripts/utils/renderCharacter.js';
        import { characterNames } from './assets/scripts/utils/cardProgression.js';

        const grid = document.querySelector('#preview-grid');
        const status = document.querySelector('#preview-status');
        let fallbackCount = 0;

        function appendFallback(characterName) {
            const card = document.createElement('article');
            card.className = 'preview-fallback';
            card.setAttribute('role', 'img');
            card.setAttribute('aria-label', `${characterName}: missing character information`);

            const name = document.createElement('p');
            name.className = 'preview-fallback-name';
            name.textContent = characterName;

            const symbol = document.createElement('p');
            symbol.className = 'preview-fallback-symbol';
            symbol.setAttribute('aria-hidden', 'true');
            symbol.textContent = '⬛';

            const note = document.createElement('p');
            note.className = 'preview-fallback-note';
            note.textContent = 'Missing card data';

            card.append(name, symbol, note);
            grid.append(card);
        }

        try {
            for (const characterName of characterNames) {
                try {
                    const dataModule = await import(
                        `./assets/data/characters/${characterName}.js`
                    );
                    const character = dataModule[`${characterName}Char`];
                    const requiredText = [
                        character?.charName,
                        character?.charType,
                        character?.value,
                        character?.special?.name,
                        character?.special?.type
                    ];
                    const requiredNumbers = [
                        character?.rating,
                        character?.level,
                        character?.damage,
                        character?.health,
                        character?.special?.charge,
                        character?.special?.damage
                    ];
                    if (requiredText.some(value => typeof value !== 'string' || !value.trim()) ||
                        requiredNumbers.some(value => typeof value !== 'number' || !Number.isFinite(value))) {
                        throw new Error(`Character data for "${characterName}" is incomplete.`);
                    }

                    const card = await renderCharacter(characterName, grid);
                    card.removeAttribute('role');
                    card.removeAttribute('tabindex');
                    card.removeAttribute('aria-label');
                } catch (error) {
                    fallbackCount += 1;
                    appendFallback(characterName);
                    console.warn(`Could not render ${characterName}; using its fallback card.`, error);
                }
            }

            status.textContent = `${characterNames.length} cards | ${fallbackCount} missing-data fallbacks`;
        } catch (error) {
            status.textContent = 'Could not load character data';
            console.error('Could not discover character data files.', error);
        }
    </script>
</body>
</html>
