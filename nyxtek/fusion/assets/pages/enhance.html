<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhance Cards</title>
    <script type="module" src="../animations/background.js"></script>
    <script type="module" src="../scripts/game/enhance.js?v=13"></script>
    <script type="module" src="../scripts/game/navigate.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Isometra&family=Orbitron&family=Cinzel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css?v=3">
    <link rel="stylesheet" href="../styles/card.css?v=40">
    <link rel="stylesheet" href="../styles/utils.css">
    <link rel="stylesheet" href="../styles/deck.css?v=17">
    <link rel="stylesheet" href="../styles/responsive.css?v=4">
</head>

<body class="enhance-page">
    <button id="back-to-main" class="button" type="button" data-navigate="deck.html" aria-label="Back to deck">×</button>
    <h1 id="enhance-title" class="title">Enhance Cards</h1>
    <div id="enhanceDiv">
        <div id="enhanceCards" data-drop-zone aria-label="Card to enhance"></div>
        <section id="enhanceChanges" aria-live="polite">
            <p class="enhance-instructions">Drag a card here.</p>
            <div id="enhance-star-choices" aria-label="Select a star to enhance"></div>
            <div id="enhance-preview"></div>
            <p id="enhance-error" class="training-error" role="alert"></p>
            <button id="enhance-confirm" class="button training-confirm" type="button" disabled>
                Enhance Card
            </button>
        </section>
    </div>
    <section id="enhance-collections" aria-label="Your cards">
        <div class="training-collection-container">
            <h2>Deck</h2>
            <div id="enhance-deck" class="training-card-list enhance-card-list" data-drop-zone
                aria-label="Cards in your deck"></div>
        </div>
        <div class="training-collection-container">
            <h2>Storage</h2>
            <div id="enhance-storage" class="training-card-list enhance-card-list" data-drop-zone
                aria-label="Cards in storage"></div>
        </div>
    </section>
    <section id="enhance-stones" aria-label="Elemental stone balances">
        <h2>Elemental Stones</h2>
        <div class="enhance-stone-balances">
            <div class="enhance-stone-balance" data-stone-type="fire">
                <img src="../images/icons/firegem.png" alt="">
                <span>Fire</span>
                <strong id="enhance-fire-stones" aria-live="polite">0</strong>
            </div>
            <div class="enhance-stone-balance" data-stone-type="water">
                <img src="../images/icons/watergem.png" alt="">
                <span>Water</span>
                <strong id="enhance-water-stones" aria-live="polite">0</strong>
            </div>
            <div class="enhance-stone-balance" data-stone-type="nature">
                <img src="../images/icons/naturegem.png" alt="">
                <span>Nature</span>
                <strong id="enhance-nature-stones" aria-live="polite">0</strong>
            </div>
            <div class="enhance-stone-balance" data-stone-type="electric">
                <img src="../images/icons/lightinggem.png" alt="">
                <span>Electric</span>
                <strong id="enhance-electric-stones" aria-live="polite">0</strong>
            </div>
            <div class="enhance-stone-balance" data-stone-type="dark">
                <img src="../images/icons/darkgem.png" alt="">
                <span>Dark</span>
                <strong id="enhance-dark-stones" aria-live="polite">0</strong>
            </div>
            <div class="enhance-stone-balance" data-stone-type="light">
                <img src="../images/icons/lightgem.png" alt="">
                <span>Light</span>
                <strong id="enhance-light-stones" aria-live="polite">0</strong>
            </div>
        </div>
    </section>
</body>

</html>
