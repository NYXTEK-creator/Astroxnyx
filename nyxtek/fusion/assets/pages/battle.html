<!DOCTYPE html>
<html lang="en" class="battle-page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="../animations/background.js"></script>
    <script type="module" src="../scripts/game/navigate.js"></script>
    <script type="module" src="../scripts/game/battle.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Isometra&family=Orbitron&family=Cinzel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/card.css">
    <link rel="stylesheet" href="../styles/utils.css">
    <link rel="stylesheet" href="../styles/deck.css">
    <link rel="stylesheet" href="../styles/levels.css">
    <link rel="stylesheet" href="../styles/responsive.css">
</head>
<body class="battle-page">
    <div id="battle-intro" class="battle-intro" role="status" aria-label="Battle starting">
        <div class="battle-intro-fighter battle-intro-player">
            <div class="battle-intro-diamond">
                <img id="battle-intro-player-image" src="../images/profile.jpg" alt="">
            </div>
            <div class="battle-intro-details">
                <span id="battle-intro-player-name"></span>
                <span id="battle-intro-player-level" class="battle-intro-level"></span>
            </div>
        </div>
        <span class="battle-intro-vs" aria-hidden="true">VS</span>
        <div class="battle-intro-fighter battle-intro-opponent">
            <div class="battle-intro-details">
                <span id="battle-intro-opponent-name"></span>
                <span id="battle-intro-opponent-level" class="battle-intro-level"></span>
            </div>
            <div class="battle-intro-diamond">
                <span id="battle-intro-opponent-type" class="battle-intro-type"></span>
            </div>
        </div>
    </div>
    <aside id="opponent-profile" class="battle-opponent-profile" aria-label="Opponent profile">
        <div class="opponent-profile-details">
            <span id="opponent-profile-name" class="opponent-profile-name"></span>
            <span id="opponent-profile-level" class="opponent-profile-level"></span>
        </div>
        <span class="opponent-avatar" aria-hidden="true">
            <span id="opponent-avatar" class="opponent-type-emoji"></span>
        </span>
    </aside>
    <div id="main">
        <button id="profile_image" class="button" type="button" aria-label="Open profile" aria-haspopup="dialog" aria-expanded="false">
            <img id="profile-picture" src="../images/profile.jpg" class="transImg" alt="Profile picture">
        </button>
        <span id="profile"></span>
        <span id="player-level" class="player-level-badge" aria-label="Player level"></span>
    </div>
    <div id="profileDiv" role="dialog" aria-modal="true" aria-labelledby="profile-title" hidden>
        <div class="profile-panel">
            <button id="close-profile" class="button" type="button" aria-label="Close profile">×</button>
            <h1 id="profile-title" class="title">Profile</h1>
            <img id="profile-preview" class="transImg profile-preview" src="../images/profile.jpg" alt="Profile picture preview">
            <p id="profile-name" class="profile-detail"></p>
            <p id="profile-type" class="profile-detail"></p>
            <p id="profile-level" class="profile-detail"></p>
            <p id="experience-label" class="profile-detail">Experience to next level</p>
            <div id="profile-experience" class="experience-bar" role="progressbar" aria-labelledby="experience-label" aria-valuemin="0" aria-valuemax="16" aria-valuenow="0">
                <div id="experience-fill" class="experience-fill"></div>
                <span id="experience-progress" aria-live="polite"></span>
            </div>
            <button id="profile-upload" class="button" type="button">Upload profile picture</button>
            <input id="profile-image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
            <p id="profile-image-status" role="status" aria-live="polite"></p>
            <section class="profile-settings" aria-labelledby="profile-settings-title">
                <h2 id="profile-settings-title">Settings</h2>
                <p>Start a new game by deleting this account and all saved progress.</p>
                <button id="reset-account" class="reset-account-button" type="button">Start Over</button>
                <p id="reset-account-status" role="status" aria-live="polite"></p>
            </section>
        </div>
    </div>
    <div id="opponentCards" aria-label="Opponent cards">

    </div>
    </div>
    <div id="playerCards" aria-label="Your cards">
        <div class="emptyCard battle-slot" role="button" tabindex="0" aria-label="Empty card slot 1">
            <img src="../images/icons/plus.png" alt="">
        </div>
        <div class="emptyCard battle-slot" role="button" tabindex="0" aria-label="Empty card slot 2">
            <img src="../images/icons/plus.png" alt="">
        </div>
        <div class="emptyCard battle-slot" role="button" tabindex="0" aria-label="Empty card slot 3">
            <img src="../images/icons/plus.png" alt="">
        </div>
        <div class="emptyCard battle-slot" role="button" tabindex="0" aria-label="Empty card slot 4">
            <img src="../images/icons/plus.png" alt="">
        </div>
        <div class="emptyCard battle-slot" role="button" tabindex="0" aria-label="Empty card slot 5">
            <img src="../images/icons/plus.png" alt="">
        </div>
    </div>
    <section id="player-hand-area" aria-label="Your turn">
        <p id="battle-turn-status" role="status" aria-live="polite"></p>
        <div id="player-hand" aria-label="Random cards to choose from" hidden></div>
    </section>
    <button id="battle-quit" class="button" type="button">Quit Battle</button>
    <dialog id="battle-quit-dialog" class="battle-result battle-quit-dialog" aria-labelledby="battle-quit-title">
        <h2 id="battle-quit-title">Quit this battle?</h2>
        <p>You will forfeit the battle and receive 20% of its rewards.</p>
        <div class="battle-result-actions">
            <button id="battle-quit-cancel" class="button" type="button">Keep Playing</button>
            <button id="battle-quit-confirm" class="button battle-quit-confirm" type="button">Quit Battle</button>
        </div>
    </dialog>
</body>

</html>
