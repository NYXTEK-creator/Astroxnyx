<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="../animations/background.js"></script>
    <script type="module" src="../scripts/game/cards.js?v=23"></script>
    <script type="module" src="../scripts/game/navigate.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Isometra&family=Orbitron&family=Cinzel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css?v=3">
    <link rel="stylesheet" href="../styles/card.css?v=41">
    <link rel="stylesheet" href="../styles/utils.css">
    <link rel="stylesheet" href="../styles/deck.css?v=17">
    <link rel="stylesheet" href="../styles/responsive.css?v=4">
</head>

<body class="training-page">
    <button id="back-to-main" class="button" type="button" data-navigate="deck.html" aria-label="Back to main menu">×</button>
    <div id="train-coins" class="currency-balance" aria-label="Coin balance">
        <img src="../images/icons/coin.png" alt="">
        <span id="train-coin-amount" aria-live="polite">0</span>
        <span>Coins</span>
    </div>
    <div id="trainDiv">
        <div id="trainCards" data-drop-zone aria-label="Train card selection"></div>
        <div id="changes"></div>
        <div id="sacrificeCards" data-drop-zone aria-label="Sacrifice card selection"></div>
    </div>
    <section id="training-collections" aria-label="Your cards">
        <div id="training-deck-container" class="training-collection-container">
            <h2>Deck</h2>
            <div id="training-deck" class="training-card-list" data-drop-zone
                aria-label="Cards in your deck"></div>
        </div>
        <div id="storage-container" class="training-collection-container">
            <h2>Storage</h2>
            <div id="storage" data-drop-zone aria-label="Available cards"></div>
        </div>
    </section>
</body>

</html>
