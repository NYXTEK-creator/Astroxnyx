<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuse Cards</title>
    <script type="module" src="../animations/background.js"></script>
    <script type="module" src="../scripts/game/fuse.js?v=7"></script>
    <script type="module" src="../scripts/game/navigate.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Isometra&family=Orbitron&family=Cinzel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css?v=3">
    <link rel="stylesheet" href="../styles/card.css?v=42">
    <link rel="stylesheet" href="../styles/utils.css">
    <link rel="stylesheet" href="../styles/deck.css?v=17">
    <link rel="stylesheet" href="../styles/responsive.css?v=5">
</head>

<body class="fuse-page">
    <button id="back-to-main" class="button" type="button" data-navigate="deck.html"
        aria-label="Back to deck">×</button>
    <h1 id="fuse-title" class="title"><span id="player-name"></span>'s Card Fusion</h1>
    <main id="fuse-workspace" aria-labelledby="fuse-title">
        <section class="fuse-equation" aria-label="Choose two maximum-level cards and see their fusion">
            <div class="fuse-card-section">
                <h2>First card</h2>
                <div id="fuse-first-card" class="fuse-card-slot" aria-live="polite"></div>
                <button class="button fuse-clear-button" id="fuse-clear-first" type="button" disabled>
                    Clear
                </button>
            </div>
            <span class="fuse-equation-symbol" aria-hidden="true">+</span>
            <div class="fuse-card-section">
                <h2>Second card</h2>
                <div id="fuse-second-card" class="fuse-card-slot" aria-live="polite"></div>
                <button class="button fuse-clear-button" id="fuse-clear-second" type="button" disabled>
                    Clear
                </button>
            </div>
            <span class="fuse-equation-symbol" aria-hidden="true">=</span>
            <div class="fuse-card-section">
                <h2>Fusion result</h2>
                <div id="fuse-result-card" class="fuse-card-slot" aria-live="polite"></div>
            </div>
        </section>
        <p id="fuse-coins" class="fuse-cost" aria-live="polite"></p>
        <p id="fuse-cost" class="fuse-cost" aria-live="polite"></p>
        <p id="fuse-status" class="fuse-status" role="status" aria-live="polite"></p>
        <button id="fuse-confirm" class="button fuse-confirm-button" type="button" disabled>
            Fuse cards
        </button>
        <section class="fuse-available-section" aria-labelledby="fuse-available-heading">
            <h2 id="fuse-available-heading">Maximum-level cards</h2>
            <div id="fuse-available" class="fuse-available-cards" aria-label="Available maximum-level cards"></div>
        </section>
    </main>
</body>

</html>
