<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="../animations/background.js"></script>
    <script type="module" src="../scripts/game/cards.js?v=23"></script>
    <script type="module" src="../scripts/game/navigate.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Isometra&family=Orbitron&family=Cinzel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css?v=3">
    <link rel="stylesheet" href="../styles/card.css?v=41">
    <link rel="stylesheet" href="../styles/utils.css">
    <link rel="stylesheet" href="../styles/deck.css?v=17">
    <link rel="stylesheet" href="../styles/responsive.css?v=4">
</head>

<body class="deck-page">
    <button id="back-to-main" class="button" type="button" data-navigate="main.html" aria-label="Back to main menu">×</button>
    <header class="deck-heading">
        <h1 class="title"><span id="player-name"></span>'s Deck</h1>
        <button id="edit-deck" class="button" type="button" aria-expanded="false"
            aria-controls="deck-editor">Edit Deck</button>
    </header>
    <main id="inventory">
        <div id="card-container" aria-label="Card inventory"></div>
        <section id="deck-editor" aria-label="Edit deck" hidden>
            <div class="deck-editor-column">
                <h2>Deck <span id="deck-edit-count"></span></h2>
                <div id="deck-edit-cards" class="deck-edit-card-list"></div>
            </div>
            <div class="deck-editor-column">
                <h2>Storage <span id="storage-edit-count"></span></h2>
                <div id="storage-edit-cards" class="deck-edit-card-list"></div>
            </div>
        </section>
    </main>
    <nav class="deck-actions" aria-label="Card actions">
        <button id="train" class="button" data-navigate="train.html">
            <p>Train</p>
        </button>
        <button id="enhance" class="button" data-navigate="enhance.html">
            <p>Enhance</p>
        </button>
        <button id="fuse" class="button" data-navigate="fuse.html">
            <p>Fuse</p>
        </button>
        <button id="book" class="button" data-navigate="book.html">
            <p>Book</p>
        </button>
    </nav>
</body>

</html>
